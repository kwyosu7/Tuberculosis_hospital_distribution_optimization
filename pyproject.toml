[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tbopt"
version = "0.2.0"
description = "Age-structured optimization of tuberculosis hospital allocation in South Korea"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "pandas", "scipy", "matplotlib"]

[tool.setuptools]
packages = ["tbopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
